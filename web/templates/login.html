<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · Painel Facial</title>
  <link rel="icon" href="{{ url_for('static', filename='logo.ico') }}">
  <link rel="stylesheet" href="{{ asset('index.css') }}">
</head>
<body>
  <div class="login-wrap">
    <form class="modal" id="login-form">
      <div class="modal-head">
        <div>
          <span>PAINEL FACIAL</span>
          <h2>Entrar</h2>
          <p>Use seu usuário e senha para acessar o sistema.</p>
        </div>
      </div>
      
      <label class="form-field">
        <span>Usuário</span>
        <input id="usuario" autofocus autocomplete="username" required>
      </label>
      
      <label class="form-field">
        <span>Senha</span>
        <input id="senha" type="password" autocomplete="current-password" required>
      </label>
      
      <p class="login-error" id="erro"></p>
      
      <div class="modal-actions">
        <button type="submit" class="primary-button">Entrar</button>
      </div>
    </form>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const r = await fetch('/api/login_senha', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          usuario: document.getElementById('usuario').value,
          senha: document.getElementById('senha').value
        })
      });
      const d = await r.json().catch(() => ({}));
      if (d.sucesso) {
        location.href = d.redirect;
      } else {
        document.getElementById('erro').textContent = d.mensagem || 'Erro ao entrar.';
      }
    });
  </script>
</body>
</html>
